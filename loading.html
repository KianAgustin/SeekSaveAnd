<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SeekSaveAnd</title>
<style>
  :root { --u: calc(min(80vw, 420px) / 850); --t: 2.5s; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #fff; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }

  .stage { position: relative; width: calc(var(--u) * 850); height: calc(var(--u) * 340); }
  .stage img { position: absolute; display: block; user-select: none; -webkit-user-drag: none; }

  .hand { width: calc(var(--u) * 369); top: calc(var(--u) * 45); will-change: transform; }
  .hand.l { left: calc(var(--u) * 30);  animation: handL var(--t) cubic-bezier(.45,0,.55,1) infinite; }
  .hand.r { left: calc(var(--u) * 456); animation: handR var(--t) cubic-bezier(.45,0,.55,1) infinite; }

  .magX { position: absolute; left: 0; top: 0; width: calc(var(--u) * 164); will-change: transform;
          animation: magX var(--t) cubic-bezier(.45,0,.55,1) infinite; }
  .magY { will-change: transform; animation: magY var(--t) linear infinite; }
  .magY img { position: static; width: 100%; }

  .brand { width: calc(var(--u) * 652); margin-top: calc(var(--u) * 20); }
  .wait { margin-top: 18px; font: 600 14px system-ui, sans-serif; color: #8a8a8a; opacity: 0;
          animation: fadeIn .6s ease 5s forwards; }
  .wait span { display: inline-block; animation: blink 1.2s infinite; }
  .wait span:nth-child(2) { animation-delay: .2s; }
  .wait span:nth-child(3) { animation-delay: .4s; }

  /* 67 gesture: one hand goes down while the other goes up */
  @keyframes handL { 0%,100% { transform: translateY(calc(var(--u) * 80)); } 50% { transform: translateY(0); } }
  @keyframes handR { 0%,100% { transform: translateY(0); } 50% { transform: translateY(calc(var(--u) * 80)); } }

  /* magnifier rides to whichever hand is lower */
  @keyframes magX { 0%,100% { transform: translateX(calc(var(--u) * 151)); } 50% { transform: translateX(calc(var(--u) * 523)); } }
  @keyframes magY {
    0%,100% { transform: translateY(calc(var(--u) * 2))   rotate(-8deg); animation-timing-function: cubic-bezier(.2,.7,.4,1); }
    25%     { transform: translateY(calc(var(--u) * -60)) rotate(0deg);  animation-timing-function: cubic-bezier(.6,0,.8,.3); }
    50%     { transform: translateY(calc(var(--u) * 2))   rotate(8deg);  animation-timing-function: cubic-bezier(.2,.7,.4,1); }
    75%     { transform: translateY(calc(var(--u) * -60)) rotate(0deg);  animation-timing-function: cubic-bezier(.6,0,.8,.3); }
  }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes blink { 0%,100% { opacity: .2; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: 3s !important; } }
  .offline { display: none; margin-top: 18px; padding: 0 24px; text-align: center; font: 600 15px/1.45 system-ui, sans-serif; color: #FF3B2F; }
  .offline small { display: block; margin-top: 2px; font-weight: 500; font-size: 13px; color: #6b7280; }
  body.off .wait { display: none; }
  body.off .offline { display: block; }
</style>
